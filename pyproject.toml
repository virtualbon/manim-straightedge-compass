[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-straightedge-compass"
version = "0.1.0"
description = "A Manim plugin for straightedge-and-compass (ruler & compass) geometric constructions with animated tools."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "manim-sc contributors" }]
keywords = ["manim", "geometry", "compass", "straightedge", "euclid", "animation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "manim>=0.18",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/example/manim-straightedge-compass"

[tool.setuptools.packages.find]
include = ["manim_sc*"]
